name: VillageSQL Rust Extension Build and Test
description: Runs Rust unit tests, installs cargo-vsql, and runs cargo vsql test against the VillageSQL dev server

inputs:
  extension-name:
    description: "Extension name (used for artifact naming)"
    required: true
  github-token:
    description: "GitHub token for downloading artifacts from villagesql/villagesql-server"
    required: true
  extension-dir:
    description: "Relative path to extension directory"
    required: false
    default: "."
  villagesql-version:
    description: "VillageSQL dev server version to test against. Use a release tag (e.g. '0.0.4') or 'nightly' for the latest build."
    required: false
    default: "nightly"
  villagesql-product:
    description: "Server product to test against when villagesql-version is a release (e.g. 'mysql-8.4', 'mysql-9.7', 'percona-8.4')."
    required: false
    default: "mysql-8.4"

runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Run Rust tests
      shell: bash
      working-directory: ${{ inputs.extension-dir }}
      run: cargo test

    - name: Install cargo-vsql
      shell: bash
      run: cargo install cargo-vsql

    - name: Download VillageSQL dev server
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.villagesql-version }}
        PRODUCT: ${{ inputs.villagesql-product }}
      run: |
        if [ "$VERSION" = "nightly" ]; then
          RUN_ID=$(gh run list \
            --repo villagesql/villagesql-server \
            --workflow extension-compat.yml \
            --status success \
            --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          gh run download "$RUN_ID" \
            --repo villagesql/villagesql-server \
            --name devserver-linux-x86_64 \
            --dir .
        else
          TAG="$VERSION"
          if ! gh release view "$TAG" --repo villagesql/villagesql-server >/dev/null 2>&1; then
            TAG="release/$VERSION"
          fi
          gh release download "$TAG" \
            --repo villagesql/villagesql-server \
            --pattern "villagesql-dev-server-${PRODUCT}_*-linux-x86_64.tar.gz" \
            --dir .
        fi

    - name: Extract VillageSQL dev server
      shell: bash
      run: |
        set -- villagesql-dev-server-*.tar.gz
        if [ "$#" -ne 1 ]; then
          echo "Expected one dev server tarball, found $#: $*" >&2
          exit 1
        fi
        tar xzf "$1"
        echo "VillageSQL_BUILD_DIR=$GITHUB_WORKSPACE/$(ls -d villagesql-dev-server-*/)" >> "$GITHUB_ENV"

    - name: Test & Package
      shell: bash
      working-directory: ${{ inputs.extension-dir }}
      run: cargo vsql test

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.extension-name }}.veb
        path: ${{ inputs.extension-dir }}/dist/${{ inputs.extension-name }}.veb
