name: VillageSQL Rust Extension Build
description: Runs Rust unit tests and installs cargo-vsql, caching the binary for use in the test action

inputs:
  extension-dir:
    description: "Relative path to extension directory"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Environment
      shell: bash
      run: sudo apt-get install -y --no-install-recommends libclang-dev

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Run Rust tests
      shell: bash
      working-directory: ${{ inputs.extension-dir }}
      run: cargo test

    - name: Install cargo-vsql
      shell: bash
      # TODO: replace with `cargo install cargo-vsql` once published to crates.io
      run: |
        git clone --depth=1 https://github.com/villagesql/vsql-rust-sdk.git /tmp/vsql-rust-sdk
        cargo install --path /tmp/vsql-rust-sdk/cargo-vsql

